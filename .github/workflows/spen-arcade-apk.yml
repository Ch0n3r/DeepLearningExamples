name: S Pen Arcade APK

# Собирает готовый APK и кладёт его в артефакты сборки.
# Запускается вручную (Actions → Run workflow) или при изменениях в spen-arcade/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'spen-arcade/**'
      - '.github/workflows/spen-arcade-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- веб-часть: игра собирается в один HTML-файл --------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: spen-arcade/web/package-lock.json

      - name: Собрать игру
        working-directory: spen-arcade/web
        run: |
          npm ci
          npm run build

      - name: Положить игру в assets
        run: |
          mkdir -p spen-arcade/android/app/src/main/assets/game
          cp spen-arcade/web/dist/index.html spen-arcade/android/app/src/main/assets/game/

      # --- Android: SDK уже стоит на ubuntu-latest ------------------------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        working-directory: spen-arcade/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Переименовать по-человечески
        run: |
          cp spen-arcade/android/app/build/outputs/apk/release/app-release.apk \
             spen-arcade-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: spen-arcade-apk
          path: spen-arcade-*.apk
          retention-days: 30
